<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Review Sentiment Analysis</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .container {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #444;
            margin-bottom: 1.5rem;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            margin-bottom: 1rem;
            box-sizing: border-box;
            resize: vertical;
        }
        button {
            background-color: #ff9900; /* Amazon Orange */
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: #e68a00;
            transform: translateY(-2px);
        }
        .prediction {
            margin-top: 2rem;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .positive {
            color: #28a745; /* Green for Positive */
        }
        .negative {
            color: #dc3545; /* Red for Negative */
        }
        .neutral {
            color: #6c757d; /* Gray for Neutral */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Amazon Review Sentiment Analyzer 📦</h1>
        <p style="margin-top:-1rem; margin-bottom:1.5rem; color:#666;">Enter a review to determine if its sentiment is positive, negative, or neutral.</p>
        <form action="/predict" method="post">
            <textarea name="review" placeholder="e.g., 'This product was amazing and worked perfectly!'" required>{{ review or '' }}</textarea><br>
            <button type="submit">Analyze Sentiment</button>
        </form>
        
        {% if prediction %}
            <div class="prediction">
                <p>Sentiment Prediction: 
                    <span class="{% if prediction == 'Positive' %}positive{% elif prediction == 'Neutral' %}neutral{% else %}negative{% endif %}">
                        {{ prediction }}
                    </span>
                </p>
            </div>
        {% endif %}
    </div>
</body>
</html>
